name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The canonical toolchain, and the one place where the project's
      # "warning-free build" rule is enforced mechanically.
      - name: Build (warnings are errors)
        run: make CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror -g -Iinclude"
      - name: Test
        run: make test
      - name: Differential test (mycc vs gcc)
        run: make difftest

  windows:
    name: Windows (MSYS2 / UCRT64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build
        shell: msys2 {0}
        run: make
      - name: Test
        shell: msys2 {0}
        run: make test
      - name: Differential test (mycc vs gcc)
        shell: msys2 {0}
        run: make difftest
      # The batch scripts are the build path the README tells a Windows reader
      # to take, and they are a *second* entry point that can drift from the
      # Makefile: it did, and a fresh clone could not link (BUG-028). Run it.
      - name: Build and test through the batch scripts
        shell: cmd
        run: |
          if exist C:\msys64\ucrt64\bin\gcc.exe set "PATH=C:\msys64\ucrt64\bin;%PATH%"
          build.bat
          if errorlevel 1 exit /b 1
          test.bat

  # Exists to keep BUG-018 honest: the harness used to pass -no-pie (rejected by
  # Apple's linker) and the compiler emitted ELF symbol names, so a macOS build
  # could not link. The Makefile now drops the flag on Darwin and asks for
  # --target=darwin, which prefix-qualifies every external symbol with '_'.
  macos:
    name: macOS (Apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Differential test (mycc vs clang)
        run: make difftest
