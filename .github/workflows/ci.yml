name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test

  windows:
    name: Windows (MSYS2 / UCRT64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build
        shell: msys2 {0}
        run: make
      - name: Test
        shell: msys2 {0}
        run: make test
